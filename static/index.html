<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Alto Motors Triage</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
  textarea { width: 100%; height: 80px; font-size: 15px; padding: 8px; }
  button { margin-top: 10px; padding: 8px 16px; font-size: 15px; cursor: pointer; }
  #result { margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 6px; white-space: pre-wrap; }
</style>
</head>
<body>

<h2>Alto Motors — Inquiry Triage</h2>

<textarea id="msg" placeholder="Type a customer message..."></textarea>
<button onclick="send()">Triage</button>

<div id="result"></div>

<script>
async function send() {
  const message = document.getElementById('msg').value;
  document.getElementById('result').textContent = "Loading...";

  const res = await fetch('/api/triage', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({message: message})
  });
  const data = await res.json();

  document.getElementById('result').textContent = JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
