<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alto Motors — Inquiry_Desk </title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171c;
    --bg-panel:#1b1f26;
    --bg-card:#20242c;
    --line:#2d3339;
    --line-soft:#262b32;
    --ink:#e8eaed;
    --ink-dim:#8b929c;
    --ink-faint:#5a6169;
    --amber:#ffb84d;
    --amber-dim:#3d3021;
    --go:#4ade80;
    --go-dim:#173324;
    --hold:#ff7a5c;
    --hold-dim:#3a2018;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .display{font-family:'Space Grotesk',sans-serif}
  .mono{font-family:'IBM Plex Mono',monospace}

  .wrap{max-width:980px;margin:0 auto;padding:0 20px 72px}

  header{
    padding:36px 0 24px;
    display:flex;justify-content:space-between;align-items:flex-end;
    gap:20px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);
  }
  .mark{display:flex;align-items:center;gap:12px}
  .mark svg{flex-shrink:0}
  .mark h1{font-size:21px;font-weight:600;letter-spacing:-.01em}
  .mark p{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.12em;margin-top:2px}
  .Inquiry-count{text-align:right}
  .Inquiry-count b{display:block;font-size:26px;font-weight:600;font-family:'IBM Plex Mono',monospace;color:var(--amber)}
  .Inquiry-count span{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.1em}

  .intake{
    margin-top:28px;background:var(--bg-panel);
    border:1px solid var(--line);border-radius:10px;
    padding:22px;
  }
  .intake label{
    font-size:11px;text-transform:uppercase;letter-spacing:.12em;
    color:var(--ink-faint);display:block;margin-bottom:10px;
  }
  textarea{
    width:100%;min-height:76px;resize:vertical;
    background:var(--bg);border:1px solid var(--line);border-radius:7px;
    color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;
    padding:13px 14px;line-height:1.5;
  }
  textarea::placeholder{color:var(--ink-faint)}
  textarea:focus{outline:none;border-color:var(--amber)}

  .controls{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
  button.primary{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;
    background:var(--amber);color:#1a1305;border:none;border-radius:7px;
    padding:11px 22px;cursor:pointer;transition:transform .12s ease, background .12s ease;
  }
  button.primary:hover{background:#ffc670}
  button.primary:active{transform:scale(.97)}
  button.primary:disabled{opacity:.4;cursor:not-allowed}
  button.primary:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

  .samples{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
  .chip{
    font-family:'IBM Plex Mono',monospace;font-size:11px;
    background:transparent;border:1px solid var(--line);color:var(--ink-dim);
    padding:7px 11px;border-radius:6px;cursor:pointer;transition:border-color .12s, color .12s;
  }
  .chip:hover{border-color:var(--amber);color:var(--amber)}

  .queue{margin-top:32px}
  .queue-label{
    font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-faint);
    padding-bottom:10px;margin-bottom:16px;border-bottom:1px solid var(--line-soft);
    display:flex;justify-content:space-between;
  }

  .card{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;
    margin-bottom:16px;overflow:hidden;
    animation:rise .35s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .card-top{
    display:flex;justify-content:space-between;align-items:center;
    padding:13px 20px;border-bottom:1px solid var(--line-soft);
  }
  .tag{
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;
    padding:5px 10px;border-radius:5px;
  }
  .tag.hold{background:var(--hold-dim);color:var(--hold)}
  .tag.go{background:var(--go-dim);color:var(--go)}
  .ticket-id{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint)}

  .card-body{display:grid;grid-template-columns:1fr 220px;gap:0}
  @media(max-width:680px){.card-body{grid-template-columns:1fr}}

  .card-main{padding:18px 20px}
  .msg{
    font-size:15px;line-height:1.55;color:var(--ink);
    padding-left:12px;border-left:2px solid var(--line);margin-bottom:16px;
  }
  .msg[dir="rtl"]{border-left:none;border-right:2px solid var(--line);padding-left:0;padding-right:12px}

  .reply-head{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);
    margin-bottom:6px;
  }
  .reply{font-size:14px;color:var(--ink-dim);line-height:1.5}
  .reply[dir="rtl"]{text-align:right}

  .card-meta{
    background:var(--bg-card);padding:18px 20px;
    border-left:1px solid var(--line-soft);
    display:flex;flex-direction:column;gap:14px;
  }
  @media(max-width:680px){.card-meta{border-left:none;border-top:1px solid var(--line-soft)}}

  .meta-row{display:flex;justify-content:space-between;font-size:12px;font-family:'IBM Plex Mono',monospace}
  .meta-row .k{color:var(--ink-faint)}
  .meta-row .v{color:var(--ink);text-align:right}
  .meta-row .v.dim{color:var(--ink-faint)}

  .gauge-wrap{text-align:center;padding-top:2px}
  .gauge-num{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;margin-top:4px}
  .gauge-cap{font-size:9.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}

  .empty{
    padding:52px 20px;text-align:center;color:var(--ink-faint);
    border:1px dashed var(--line);border-radius:10px;margin-top:16px;
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;
  }
  .err{
    padding:14px 18px;background:var(--hold-dim);color:var(--hold);
    border-radius:8px;margin-top:16px;font-size:13.5px;border:1px solid #4a2820;
  }
  .loading{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--amber);
    padding:16px 4px;display:flex;align-items:center;gap:9px;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mark">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
        <rect width="34" height="34" rx="8" fill="#ffb84d"/>
        <path d="M8 21L10 14H24L26 21" stroke="#1a1305" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6 21H28V24H6V21Z" fill="#1a1305"/>
        <circle cx="11.5" cy="24" r="2" fill="#ffb84d" stroke="#1a1305" stroke-width="1.5"/>
        <circle cx="22.5" cy="24" r="2" fill="#ffb84d" stroke="#1a1305" stroke-width="1.5"/>
      </svg>
      <div>
        <h1 class="display">Inquiry_Desk Inquiry</h1>
        <p>Alto Motors · Velmora</p>
      </div>
    </div>
    <div class="Inquiry-count">
      <b id="counter">00</b>
      <span>processed today</span>
    </div>
  </header>

  <section class="intake">
    <label>Incoming inquiry</label>
    <textarea id="inp" placeholder="Paste a WhatsApp message, web form entry, or walk-in note…"></textarea>
    <div class="controls">
      <button class="primary" id="go">Run Inquiry_Desk</button>
      <div class="samples" id="samples"></div>
    </div>
  </section>

  <section class="queue">
    <div class="queue-label">
      <span>Queue</span>
      <span id="flagline"></span>
    </div>
    <div id="out">
      <div class="empty">Inquiry is empty. Enter a message above or pick a sample to begin.</div>
    </div>
  </section>

</div>

<script>
const SAMPLES = [
  ["clean", "Hi, I'd like to book a test drive for the Renzo GT this weekend."],
  ["mixed", "I want to trade in my old Karva sedan and also check financing for a new Renzo."],
  ["vague", "is this still available?"],
  ["arabic", "ابغى اسوق تجربة لسيارة رينزو الجديدة"],
  ["ar-en", "Salam, I need EMI options for Karva w kaman badi a3rif value of my old car."]
];

const inp = document.getElementById('inp');
const out = document.getElementById('out');
const btn = document.getElementById('go');
const counter = document.getElementById('counter');
const flagline = document.getElementById('flagline');
const samplesBox = document.getElementById('samples');

let handled = 0, flagged = 0, first = true;

SAMPLES.forEach(([name, text]) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chip'; b.textContent = name;
  b.onclick = () => { inp.value = text; inp.focus(); };
  samplesBox.appendChild(b);
});

function esc(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '—' : String(s);
  return d.innerHTML;
}
function isArabic(lang){ return lang && lang.toLowerCase().startsWith('arabic') && !lang.includes('mix'); }
function pad(n){ return String(n).padStart(2, '0'); }

function gaugeSVG(pct, held){
  const angle = -90 + (pct / 100) * 180;
  const color = held ? 'var(--hold)' : 'var(--go)';
  return `
    <svg width="108" height="64" viewBox="0 0 108 64">
      <path d="M8 58 A46 46 0 0 1 100 58" fill="none" stroke="var(--line)" stroke-width="7" stroke-linecap="round"/>
      <path d="M8 58 A46 46 0 0 1 100 58" fill="none" stroke="${color}" stroke-width="7"
            stroke-linecap="round" stroke-dasharray="${(pct/100)*144.5} 200"/>
      <line x1="54" y1="58" x2="${54 + 34*Math.cos(angle*Math.PI/180)}" y2="${58 + 34*Math.sin(angle*Math.PI/180)}"
            stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="54" cy="58" r="4" fill="var(--ink)"/>
      <line x1="8" y1="58" x2="8" y2="52" stroke="var(--ink-faint)" stroke-width="1.5"/>
      <line x1="100" y1="58" x2="100" y2="52" stroke="var(--ink-faint)" stroke-width="1.5"/>
    </svg>`;
}

function render(d){
  const pct = Math.round((d.confidence || 0) * 100);
  const held = !!d.human_review;
  const el = document.createElement('article');
  el.className = 'card';
  el.innerHTML = `
    <div class="card-top">
      <span class="tag ${held ? 'hold' : 'go'}">${held ? 'Hold — human review' : 'Cleared'}</span>
      <span class="ticket-id">#${String(handled + 1).padStart(4,'0')}</span>
    </div>
    <div class="card-body">
      <div class="card-main">
        <div class="msg" ${isArabic(d.detected_language) ? 'dir="rtl"' : ''}>${esc(d.inquiry)}</div>
        <div class="reply-head">Drafted reply · ${held ? 'awaiting review' : 'auto-send eligible'}</div>
        <div class="reply" ${isArabic(d.detected_language) ? 'dir="rtl"' : ''}>${esc(d.draft_reply)}</div>
      </div>
      <div class="card-meta">
        <div class="gauge-wrap">
          ${gaugeSVG(pct, held)}
          <div class="gauge-num" style="color:${held ? 'var(--hold)' : 'var(--go)'}">${d.confidence}</div>
          <div class="gauge-cap">confidence · threshold 0.70</div>
        </div>
        <div class="meta-row"><span class="k">Primary</span><span class="v">${esc(d.primary_category)}</span></div>
        <div class="meta-row"><span class="k">Secondary</span><span class="v dim">${esc(d.secondary_category)}</span></div>
        <div class="meta-row"><span class="k">Language</span><span class="v">${esc(d.detected_language)}</span></div>
      </div>
    </div>`;
  return el;
}

async function submit(){
  const text = inp.value.trim();
  if(!text) return;
  btn.disabled = true;
  if(first){ out.innerHTML = ''; first = false; }

  const wait = document.createElement('div');
  wait.className = 'loading';
  wait.innerHTML = '<span class="dot"></span> Reading the Inquiry queue…';
  out.prepend(wait);

  try{
    const res = await fetch('/api/Inquiry_Desk', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:text})
    });
    if(!res.ok) throw new Error('Server returned ' + res.status);
    const data = await res.json();
    wait.remove();
    out.prepend(render(data));
    handled++; if(data.human_review) flagged++;
    counter.textContent = pad(handled);
    flagline.textContent = flagged + ' held / ' + handled + ' total';
    inp.value = '';
  }catch(e){
    wait.remove();
    const err = document.createElement('div');
    err.className = 'err';
    err.textContent = 'Could not process that inquiry — ' + e.message;
    out.prepend(err);
  }finally{
    btn.disabled = false; inp.focus();
  }
}

btn.onclick = submit;
inp.addEventListener('keydown', e => { if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)) submit(); });
</script>
</body>
</html>
